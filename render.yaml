# Render Blueprint (monorepo)
# Creates:
# - Backend Web Service (Node)
# - Frontend Static Site (Vite build)
# NOTE: You will set VITE_API_BASE in the Render dashboard after the backend is created.

services:
  - type: web
    name: smltakeoff-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      - key: SML_DATA_DIR
        value: /var/data
      - key: CORS_ORIGINS
        value: https://REPLACE_WITH_YOUR_FRONTEND_DOMAIN
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 5

  - type: web
    name: smltakeoff-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://REPLACE_WITH_YOUR_BACKEND_DOMAIN
